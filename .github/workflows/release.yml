name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev

      - run: cargo build --release

      - run: cp target/release/libnam.so nam-linux-x86_64-${{ github.ref_name }}.clap

      - uses: actions/upload-artifact@v4
        with:
          name: nam-linux-x86_64-${{ github.ref_name }}.clap
          path: nam-linux-x86_64-${{ github.ref_name }}.clap

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
